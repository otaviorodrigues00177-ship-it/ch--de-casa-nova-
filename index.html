<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chá de Casa Nova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Escolha o que levar 🎁</h1>
        <p>Se quiser nos presentear, escolha um item da lista. Assim evitamos presentes repetidos. ❤️</p>
    </header>

    <!-- Lista de Presentes -->
    <section class="gift-section">
        <div id="giftList" class="gift-list"></div>
    </section>

    <!-- Área de Seleção -->
    <section class="confirm-box">
        <h3>Seu nome</h3>
        <input type="text" id="guestName" placeholder="Digite seu nome">

        <div class="selected-display">
            <strong>Seu presente</strong>
            <p id="selectedGift">Nenhum item selecionado.</p>
        </div>

        <button id="confirmGift">Confirmar meu presente</button>
        <a id="whatsappButton" href="#" target="_blank" class="whatsapp-btn">📱 Enviar pelo WhatsApp</a>
    </section>

    <!-- Modal de Sucesso -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <p id="modalMessage"></p>
        </div>
    </div>

    <!-- ⚠️ DEIXAR O SCRIPT NO FINAL, SEMPRE! -->
    <script src="script.js"></script>
</body>
</html>
